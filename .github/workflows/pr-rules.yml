# The working rules of 2026-11-22 that a script can check (AGENTS.md section 2a): review record, builder != reviewer,
# size cap, audit before the next batch, INPUTS.sha256. Separate from validate.yml on purpose; docs/ci/README.md.
#
# Independent control: this runs on pull_request_target and issue_comment, so GitHub always uses THIS file and
# the checker as they stand on the base branch. The job checks out the base branch only and never executes anything
# from the PR: it fetches the PR head as git objects to read them as data. A PR that changes this workflow or
# scripts/check_pr_rules.py is therefore judged by the version already on main (and needs two review families).
#
# The result is published as a check run named `pr-rules` on the PR head, which is the check the ruleset requires.
# It is evaluated again on every PR event and on every PR comment created, edited or deleted, selected by PR number.
name: pr-rules

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-rules-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # default ref: the base branch (pull_request_target) or the default branch (issue_comment)
      - name: Check the PR against the working rules and publish pr-rules on its head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/check_pr_rules.py --pr "$PR" --post
