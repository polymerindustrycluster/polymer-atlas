# The working rules of 2026-11-22 that a script can check (AGENTS.md section 2a): review record, builder != reviewer,
# size cap, audit before the next batch, INPUTS.sha256. Separate from validate.yml on purpose; docs/ci/README.md.
#
# Independent control: this runs on pull_request_target and issue_comment, so GitHub always uses THIS file and
# the checker as they stand on the base branch. The job checks out the base branch only and never executes anything
# from the PR: it fetches the PR head as git objects to read them as data. A PR that changes this workflow or
# scripts/check_pr_rules.py is therefore judged by the version already on main (and needs two review families).
#
# The result is published as a check run named `pr-rules` on the PR head, which is the check the ruleset requires.
# It is evaluated again on every PR event and on every PR comment created, edited or deleted, selected by PR number.
#
# Second check run, `binding-gate`: main's scripts/check_evidence_binding.py is run against the PR's data/ and tasks/
# (fetched as data into a plain directory). The gate's provenance check executes one PR-supplied file
# (tasks/<folder>/check.py), so that job has `permissions: {}` (the repository is public: no token is needed to fetch),
# keeps no credential, and runs the gate as an unprivileged user inside a network namespace with no network
# (`unshare --net`). If the runner cannot do that, the gate is NOT executed there and the check run says SKIPPED
# (neutral); the validate job is then the only place the gate runs. If the script is not on main yet, the check run says
# "gate not yet on main" (neutral). A separate job publishes the result, so the job that runs PR code never holds a token.
name: pr-rules

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-rules-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # default ref: the base branch (pull_request_target) or the default branch (issue_comment)
      - name: Check the PR against the working rules and publish pr-rules on its head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/check_pr_rules.py --pr "$PR" --post

  binding-gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # no credential stays in .git/config for the step that runs PR-supplied code
      - name: Fetch the PR head as data and export its data/ and tasks/ to a plain directory
        run: |
          set -eu
          out=/tmp/gate-out; mkdir -p "$out"
          git fetch --no-tags -q origin "+refs/pull/$PR/head:refs/remotes/pr/$PR"   # anonymous: the repository is public
          head=$(git rev-parse "refs/remotes/pr/$PR")
          echo "$head" > "$out/head"
          git merge-base "$BASE" "$head" > "$out/base"
          python3 scripts/check_pr_rules.py --export-tree "$head" /tmp/gate-tree
          chmod -R a+rX /tmp/gate-tree
          p="$GITHUB_WORKSPACE"; while [ "$p" != / ]; do sudo chmod o+x "$p"; p=$(dirname "$p"); done
          sudo install -d -o 65534 -g 65534 /tmp/gate-home
      - name: Run main's binding gate on the PR tree (no token, no network, unprivileged)
        run: |
          set -u
          out=/tmp/gate-out; base=$(cat "$out/base"); log="$out/log"; : > "$log"
          if [ ! -f scripts/check_evidence_binding.py ]; then
            echo "gate not yet on main (scripts/check_evidence_binding.py is absent): nothing run, passes" | tee -a "$log"
            echo not_yet > "$out/state"; exit 0
          fi
          if ! /usr/bin/python3 scripts/check_evidence_binding.py --help 2>&1 | grep -q -- '--tree'; then
            echo "scripts/check_evidence_binding.py on main has no --tree mode: cannot inspect the PR tree" | tee -a "$log"
            echo cannot_inspect > "$out/state"; exit 0
          fi
          isolated() { sudo unshare --net -- setpriv --reuid 65534 --regid 65534 --clear-groups -- \
            env -i PATH=/usr/bin:/bin HOME=/tmp/gate-home PYTHONDONTWRITEBYTECODE=1 \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0='*' "$@"; }
          # prove the isolation before any PR file runs: the command must start AND fail to reach the network
          probe="import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(0 if s.connect_ex(('1.1.1.1', 53)) else 1)"
          if ! isolated /usr/bin/python3 -c "$probe"; then
            echo "SKIPPED: this runner cannot run the gate with no network and no privileges; the PR-supplied check.py was NOT executed here. The validate job runs the gate." | tee -a "$log"
            echo skipped > "$out/state"; exit 0
          fi
          rc=0
          for mode in --new-since --provenance-since; do
            echo "== check_evidence_binding.py --tree /tmp/gate-tree $mode ${base:0:10}" | tee -a "$log"
            isolated timeout 1500 /usr/bin/python3 scripts/check_evidence_binding.py --tree /tmp/gate-tree "$mode" "$base" 2>&1 | tee -a "$log"
            r=${PIPESTATUS[0]}; echo "exit $r" | tee -a "$log"
            [ "$r" -eq 0 ] || rc=1
          done
          if [ "$rc" -eq 0 ]; then echo passed > "$out/state"; else echo failed > "$out/state"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gate-out
          if-no-files-found: error

  publish-binding-gate:
    needs: binding-gate
    if: always() && needs.binding-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4  # main's checker; the downloaded files are read as text only
      - uses: actions/download-artifact@v4
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-result
      - name: Publish the binding-gate check run on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/check_pr_rules.py --publish-gate gate-result --pr "$PR"
