# The working rules of 2026-11-22 that a script can check (AGENTS.md section 2a): review record, builder != reviewer,
# size cap, audit before the next batch, INPUTS.sha256. Separate from validate.yml on purpose; docs/ci/README.md.
#
# Independent control: this runs on pull_request_target and issue_comment, so GitHub always uses THIS file and
# the checker as they stand on the base branch. The job checks out the base branch only and never executes anything
# from the PR: it fetches the PR head as git objects to read them as data. A PR that changes this workflow or
# scripts/check_pr_rules.py is therefore judged by the version already on main (and needs two review families).
#
# The result is published as a check run named `pr-rules` on the PR head, which is the check the ruleset requires.
# It is evaluated again on every PR event and on every PR comment created, edited or deleted, selected by PR number.
#
# Second check run, `binding-gate`: main's scripts/check_evidence_binding.py (--new-since and --provenance-since, each
# with --tree pr) judges the PR merge result, checked out as data into ./pr. The gate executes nothing from the PR
# tree. The job has `permissions: {}`, and both checkouts use persist-credentials: false. If the script is not on main
# yet, the check run says "gate not yet on main: nothing was checked" and passes (the gate cannot judge the PR that
# adds it); a step that cannot run its check fails, never neutral. A separate job publishes the result.
name: pr-rules

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-rules-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # default ref: the base branch (pull_request_target) or the default branch (issue_comment)
      - name: Check the PR against the working rules and publish pr-rules on its head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/check_pr_rules.py --pr "$PR" --post

  binding-gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number }}
      BASE: origin/${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4  # trusted: the base branch, whose checker and rules judge the PR
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4  # the PR merge result, as DATA in ./pr; nothing in it is executed
        with:
          ref: refs/pull/${{ env.PR }}/merge
          path: pr
          fetch-depth: 2
          persist-credentials: false  # no token in pr/.git/config
      - name: Pin the PR head the result is about
        run: |
          set -eu
          out=/tmp/gate-out; mkdir -p "$out"
          git fetch --no-tags -q origin "+refs/pull/$PR/head:refs/remotes/pr/$PR"   # anonymous: the repository is public
          head=$(git rev-parse "refs/remotes/pr/$PR")
          [ "$(git -C pr rev-parse HEAD^2)" = "$head" ] || { echo "merge ref is not the current PR head: stale, failing"; exit 1; }
          echo "$head" > "$out/head"
      - name: Run main's binding gate on the PR tree
        run: |
          set -u
          out=/tmp/gate-out; log="$out/log"; : > "$log"
          if [ ! -f scripts/check_evidence_binding.py ]; then
            echo "gate not yet on main (scripts/check_evidence_binding.py is absent): nothing was checked" | tee -a "$log"
            echo not_yet > "$out/state"; exit 0
          fi
          worst=0
          for mode in --new-since --provenance-since; do
            echo "== python3 scripts/check_evidence_binding.py $mode $BASE --tree pr" | tee -a "$log"
            if ! python3 scripts/check_evidence_binding.py --help 2>&1 | grep -q -- "$mode"; then
              echo "main's gate has no $mode: cannot inspect" | tee -a "$log"; r=2
            else
              timeout 1500 python3 scripts/check_evidence_binding.py "$mode" "$BASE" --tree pr 2>&1 | tee -a "$log"
              r=${PIPESTATUS[0]}
            fi
            echo "exit $r" | tee -a "$log"
            if [ "$r" -ne 0 ] && [ "$r" -ne 1 ]; then worst=2; elif [ "$r" -eq 1 ] && [ "$worst" -eq 0 ]; then worst=1; fi
          done
          case $worst in 0) echo passed;; 1) echo failed;; *) echo cannot_inspect;; esac > "$out/state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gate-out
          if-no-files-found: error

  publish-binding-gate:
    needs: binding-gate
    if: always() && needs.binding-gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4  # main's checker; the downloaded files are read as text only
      - uses: actions/download-artifact@v4
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-result
      - name: Publish the binding-gate check run on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: python3 scripts/check_pr_rules.py --publish-gate gate-result --pr "$PR"
