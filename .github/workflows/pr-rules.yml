# The working rules of 2026-11-22 that a script can check (AGENTS.md section 2a): size cap, audit before the next
# batch, INPUTS.sha256, and the evidence binding gate. Review (rules 1 and 4) is practice and is NOT read here: this
# workflow reads no PR comment and no review record. Separate from validate.yml on purpose; docs/ci/README.md.
#
# Independent control: this runs on pull_request_target, so GitHub always uses THIS file and the checker as they stand
# on the base branch. The `evaluate` job checks out the base branch only and never executes anything from the PR: it
# fetches the PR head as git objects to read them as data. A PR that changes this workflow or scripts/check_pr_rules.py
# is therefore judged by the version already on main.
#
# The result is published as a check run named `pr-rules` on the PR head, which the ruleset requires
# (with strict mode) since 2026-11-22: see docs/ci/README.md.
#
# Second check run, `binding-gate` (posted by publish-binding-gate; the job that does the work is `gate-run`, so exactly one
# check is named `binding-gate`, and likewise one named `pr-rules`: the evaluate job posts it and is itself named `evaluate`): main's scripts/check_evidence_binding.py (--verify-proofs and --provenance-since, each
# with --tree pr) judges the PR merge result, checked out as data into ./pr. The gate executes nothing from the PR
# tree. The job has `permissions: {}`, and both checkouts use persist-credentials: false. If the script is absent from main,
# or a cited capture cannot be replayed, the check fails closed. A separate job publishes the result.
name: pr-rules

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # default ref for pull_request_target: the base branch
      - name: Check the PR against the working rules and publish pr-rules on its head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_pr_rules.py --pr "$PR" --post

  gate-run:  # NOT named binding-gate: the required check of that name is the one publish-binding-gate posts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {}
    env:
      PR: ${{ github.event.pull_request.number }}
      BASE: origin/${{ github.event.pull_request.base.ref }}
    steps:
      - uses: actions/checkout@v4  # trusted: the base branch, whose checker and rules judge the PR
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4  # the PR merge result, as DATA in ./pr; nothing in it is executed
        with:
          ref: refs/pull/${{ env.PR }}/merge
          path: pr
          fetch-depth: 2
          persist-credentials: false  # no token in pr/.git/config
      - name: Pin the PR head the result is about
        run: |
          set -eu
          out=/tmp/gate-out; mkdir -p "$out"
          git fetch --no-tags -q origin "+refs/pull/$PR/head:refs/remotes/pr/$PR"   # anonymous: the repository is public
          head=$(git rev-parse "refs/remotes/pr/$PR")
          [ "$(git -C pr rev-parse HEAD^2)" = "$head" ] || { echo "merge ref is not the current PR head: stale, failing"; exit 1; }
          echo "$head" > "$out/head"
      - name: Run main's binding gate on the PR tree
        run: |
          set -u
          out=/tmp/gate-out; log="$out/log"; : > "$log"
          if [ ! -f scripts/check_evidence_binding.py ]; then
            echo "gate not yet on main (scripts/check_evidence_binding.py is absent): cannot inspect" | tee -a "$log"
            echo cannot_inspect > "$out/state"; exit 0
          fi
          worst=0
          for mode in --verify-proofs --provenance-since; do
            echo "== python3 scripts/check_evidence_binding.py $mode $BASE --tree pr" | tee -a "$log"
            if ! python3 scripts/check_evidence_binding.py --help 2>&1 | grep -q -- "$mode"; then
              echo "main's gate has no $mode: cannot inspect" | tee -a "$log"; r=2
            else
              timeout 1500 python3 scripts/check_evidence_binding.py "$mode" "$BASE" --tree pr 2>&1 | tee -a "$log"
              r=${PIPESTATUS[0]}
            fi
            echo "exit $r" | tee -a "$log"
            if [ "$r" -ne 0 ] && [ "$r" -ne 1 ]; then worst=2; elif [ "$r" -eq 1 ] && [ "$worst" -eq 0 ]; then worst=1; fi
          done
          case $worst in 0) echo passed;; 1) echo failed;; *) echo cannot_inspect;; esac > "$out/state"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gate-out
          if-no-files-found: error

  publish-binding-gate:
    needs: gate-run
    if: always() && needs.gate-run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@v4  # main's checker; the downloaded files are read as text only
      - uses: actions/download-artifact@v4
        with:
          name: gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: gate-result
      - name: Publish the binding-gate check run on the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/check_pr_rules.py --publish-gate gate-result --pr "$PR"
