# Validate the canonical CSVs, vocabulary export and tests on every PR and push to main.
# Edit this file directly; docs/ci/README.md describes both workflows.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the row-loss guard reads the base commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical CSVs (AGENTS.md §2 rule 5)
        run: python3 scripts/validate.py
      - name: Guard — no personal-account URL in tasks/ or docs/ (owner rulings 2026-11-18 and 2026-11-18b; owner choice 2026-11-19)
        run: python3 scripts/check_account_urls.py
      - name: Guard — no keyed data row removed without a REMOVALS.csv entry (805528a, 2026-11-04)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"; mode=""          # PR merge ref: compare at the merge-base
          else
            base="${{ github.event.before }}"; mode="--literal"    # push: judge against the commit it replaced
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against; skipping"; exit 0
          fi
          python3 scripts/check_row_loss.py --base "$base" $mode
      # The two binding steps are early feedback, NOT authoritative: this job runs the PR's own copy of the gate.
      # The authoritative run is the pull_request_target workflow (main's checker, --tree on the PR checkout).
      - name: Guard — evidence rows a PR adds or changes bind to their record (binding gate; early feedback)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_evidence_binding.py --new-since "origin/${{ github.base_ref }}"
      - name: Guard — each created_by label names its tasks/<folder>/ holding a non-empty check.py (early feedback)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_evidence_binding.py --provenance-since "origin/${{ github.base_ref }}"
      - name: Vocabulary export is current
        run: python3 scripts/export_vocab.py --check
      - name: Unit and mutation tests
        run: python3 scripts/run_tests.py  # parallel shards; each test runs once (was: unittest discover, serial)
      - name: SQLite build succeeds
        run: python3 scripts/build_sqlite.py
      - name: Guard — no generated artifacts committed
        run: |
          if git ls-files | grep -E '(\.db$|_all\.csv$|^build/)'; then
            echo "Generated artifacts must never be committed (AGENTS.md §1)"; exit 1
          fi
