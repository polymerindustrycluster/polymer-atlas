# Nightly watch on main: fails loudly (GitHub emails the failed scheduled run) and files ONE issue with the findings.
# Third-party actions are pinned to full commit SHAs (the tag is in the comment); change a pin only in a reviewed PR.
# Edit this file directly; scripts/nightly_watch.py holds the rules and docs/ci/README.md describes the workflow.
# tasks/nightly-watch-2026-11-22/README.md says what the owner must set so the email reaches them.
name: nightly-watch

on:
  schedule:
    - cron: "17 11 * * *"   # once a day at 11:17 UTC (06:17 US Eastern standard time), a few minutes past the hour
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read   # still read-only: the per-PR `validate` check runs are read from the checks API

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0  # the watch reads first-parent history and the parent of every commit in the window
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Watch the last 24 hours on main (exit 1 findings, 2 could not inspect)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a scheduled run judges the window ending on the 11:17 UTC slot (contiguous whatever the start delay);
          # a manual run judges the last 24 hours up to now
          flag=""; [ "${{ github.event_name }}" = "schedule" ] && flag="--scheduled"
          python3 scripts/nightly_watch.py $flag --ref origin/main --report-file "$RUNNER_TEMP/nightly-watch-report.txt"
      - name: Keep the report for the issue job
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-watch-report
          path: ${{ runner.temp }}/nightly-watch-report.txt
          if-no-files-found: ignore

  issue:
    needs: watch
    if: ${{ always() && needs.watch.result != 'success' && needs.watch.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write   # this job only; the watch job above cannot write anything
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true  # no report when the watch died before writing one
        with:
          name: nightly-watch-report
      - name: Open or update the single findings issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly watch: findings"
          {
            echo "Run: $RUN_URL ($(date -u +%Y-%m-%dT%H:%MZ))"; echo
            if [ -f nightly-watch-report.txt ]; then echo '```'; cat nightly-watch-report.txt; echo '```'
            else echo "The watch job ended without writing a report (see the run log). Treat this as a failed inspection."; fi
          } > body.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title \
                -q "[.[] | select(.title == \"$title\")][0].number // empty")
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md; fi
