# Proposed GitHub Actions workflow — NOT active until a human with repo admin
# commits it to .github/workflows/validate.yml (the GitHub App used by agent
# harnesses has no Workflows permission, so agents cannot place it there).
# See docs/ci/README.md. Stdlib-only: no dependencies to install.
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the row-loss guard reads the base commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical CSVs (AGENTS.md §2 rule 5)
        run: python3 scripts/validate.py
      - name: Guard — no keyed data row removed without a REMOVALS.csv entry (805528a, 2026-11-04)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"   # the checkout is the PR merged into its base
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base commit to compare against; skipping"; exit 0
          fi
          python3 scripts/check_row_loss.py --base "$base"
      - name: Vocabulary export is current
        run: python3 scripts/export_vocab.py --check
      - name: Unit and mutation tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: SQLite build succeeds
        run: python3 scripts/build_sqlite.py
      - name: Guard — no generated artifacts committed
        run: |
          if git ls-files | grep -E '(\.db$|_all\.csv$|^build/)'; then
            echo "Generated artifacts must never be committed (AGENTS.md §1)"; exit 1
          fi
