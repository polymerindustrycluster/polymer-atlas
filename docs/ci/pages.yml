# Proposed GitHub Actions workflow: publish the Atlas site to GitHub Pages.
# NOT active until a human with repo admin commits it to
# .github/workflows/pages.yml (the GitHub App used by agent harnesses has no
# Workflows permission). See docs/ci/README.md, "Publishing to GitHub Pages".
#
# On every push to main it validates the data, builds build/pages/ with
# scripts/build_pages.py (static site + graph explorers, public fields only),
# and deploys it. Stdlib-only Python: nothing to install. Generated files are
# never committed; they travel only as the Pages artifact.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical CSVs (never publish a red tree)
        run: python3 scripts/validate.py
      - name: Build the site
        run: python3 scripts/build_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
